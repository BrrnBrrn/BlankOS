<!DOCTYPE html>
<html>
<head>
  <style>
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      opacity: 0;
      animation: fadeInUp 2s ease-out forwards;
    }

  </style>
</head>
  <body style="background-color: #0d0d0d; color: #e6e6e6; font-family: Georgia, 'Times New Roman', serif;  margin: 0; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh;">

  <h1 class="fade-in" style="margin: 0 0 8px 0; font-weight: 300; letter-spacing: 2px;">BlankOS</h1>
  
  
</body>

</html>
